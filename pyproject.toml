[project]
name = "qwen-sql-finetune"
version = "0.1.0"
description = "Vertex AI fine-tune and deploy Qwen on SQL datasets"
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-cloud-aiplatform>=1.38.0",
    "python-dotenv>=1.0.0",
    # HF lines below: keep in sync with scripts/train_qwen_sql_sft.py HF_PIP_SPECS.
    "transformers>=5.5.0",
    "datasets>=2.16.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "accelerate>=1.1.0",
    "huggingface_hub>=0.23.0",
    "sentencepiece>=0.1.99",
    "google-genai>=1.0.0",
]

# Gradio UI dependencies for ``sql_compare_ui_qwen/`` (``uv sync --extra qwen-compare-ui``).
[project.optional-dependencies]
qwen-compare-ui = [
    "gradio>=4.44.0",
]

[tool.uv]
# Application project: manage deps and venv with `uv sync`, no installable package.
package = false
